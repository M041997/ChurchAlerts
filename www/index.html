<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Church Alert</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #09090b;
        color: #fafafa;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        max-width: 360px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #d4d4d8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Church Alert</h1>
      <p>Set CAPACITOR_SERVER_URL to your deployed HTTPS app before syncing iOS.</p>
    </main>
  </body>
</html>
